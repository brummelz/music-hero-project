[project]
name = "horn-hero"
version = "0.1.0"
description = "Offline desktop app that teaches young children French Horn intonation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["core", "audio", "storage", "ui", "main.py"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.*"
strict = true

<svg width="120" height="120" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#EEF3FB" stroke="#8A9AB8" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="2 1.6"/></svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home – Mode selection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:default}
</style>
</helmet>
<div style="width:1100px;height:720px;box-sizing:border-box;padding:28px;background:#E9F3FF;display:flex;flex-direction:column;gap:20px;font-family:'Nunito',sans-serif;color:#14213D">

<div style="height:64px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:14px">
<div style="width:56px;height:56px;border-radius:28px;background:#4338CA;display:flex;align-items:center;justify-content:center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
</div>
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:36px;line-height:1">Horn Hero</div>
</div>
<div style="display:flex;align-items:center;gap:14px">
<div style="height:56px;box-sizing:border-box;padding:0 20px;border-radius:28px;background:#FFC93C;display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:28px" aria-label="5 of 15 stars earned">
<svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#fff" stroke="#14213D" stroke-width="1.6" stroke-linejoin="round"/></svg>
5 / 15
</div>
<div style="height:56px;box-sizing:border-box;padding:0 20px;border-radius:28px;background:#fff;border:3px solid #14213D;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>
Horn in F
</div>
<button type="button" aria-label="Settings" style="width:56px;height:56px;border-radius:28px;background:#fff;border:3px solid #14213D;display:flex;align-items:center;justify-content:center;padding:0">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
</button>
</div>
</div>

<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:40px;line-height:1;text-align:center;margin-top:4px">What do you want to play today?</div>

<div style="flex:1;min-height:0;display:flex;gap:24px">

<div style="flex:1;min-width:0;background:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:16px">
<div style="width:60px;height:60px;border-radius:30px;background:#FFC93C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
</div>
<div>
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:36px;line-height:1">Practice</div>
<div style="font-weight:700;font-size:18px;color:#4A5A78;margin-top:4px">Pick one note and play it 10 times.</div>
</div>
</div>
<div style="display:flex;gap:14px">
<button type="button" aria-pressed="true" style="flex:1;height:150px;box-sizing:border-box;border-radius:24px;background:#EEF0FF;border:4px solid #4338CA;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#14213D;padding:0">
<div style="position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:14px;background:#4338CA;display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
</div>
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:44px;line-height:1">Do</div>
<div style="font-weight:800;font-size:22px;color:#4A5A78">C</div>
</button>
<button type="button" aria-pressed="false" style="flex:1;height:150px;box-sizing:border-box;border-radius:24px;background:#fff;border:4px solid #B8C7E0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#14213D;padding:0">
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:44px;line-height:1">Ré</div>
<div style="font-weight:800;font-size:22px;color:#4A5A78">D</div>
</button>
<button type="button" aria-pressed="false" style="flex:1;height:150px;box-sizing:border-box;border-radius:24px;background:#fff;border:4px solid #B8C7E0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#14213D;padding:0">
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:44px;line-height:1">Mi</div>
<div style="font-weight:800;font-size:22px;color:#4A5A78">E</div>
</button>
</div>
<div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:#E9F3FF;font-weight:700;font-size:18px;color:#14213D">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
Hold the note steady for 3 seconds to score a point.
</div>
</div>
<button type="button" style="height:72px;border-radius:36px;background:#4338CA;border:3px solid #4338CA;font-family:'Fredoka',sans-serif;font-weight:600;font-size:30px;color:#fff">Start practice</button>
</div>

<div style="flex:1;min-width:0;background:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:16px">
<div style="width:60px;height:60px;border-radius:30px;background:#3DD68C;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 5h13l-3 4 3 4H5"/></svg>
</div>
<div>
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:36px;line-height:1">Adventure</div>
<div style="font-weight:700;font-size:18px;color:#4A5A78;margin-top:4px">Finish levels and collect stars.</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">

<button type="button" style="height:56px;box-sizing:border-box;padding:0 16px 0 10px;border-radius:28px;background:#fff;border:3px solid #B8C7E0;display:flex;align-items:center;gap:12px;color:#14213D;text-align:left">
<div style="width:36px;height:36px;border-radius:18px;background:#BDF0D3;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;flex:none">1</div>
<div style="flex:1;font-weight:800;font-size:19px">First notes</div>
<div style="display:flex;gap:2px" role="img" aria-label="3 of 3 stars">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#FFC93C" stroke="#14213D" stroke-width="1.6" stroke-linejoin="round"/></svg>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#FFC93C" stroke="#14213D" stroke-width="1.6" stroke-linejoin="round"/></svg>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#FFC93C" stroke="#14213D" stroke-width="1.6" stroke-linejoin="round"/></svg>
</div>
</button>

<button type="button" style="height:56px;box-sizing:border-box;padding:0 16px 0 10px;border-radius:28px;background:#fff;border:3px solid #B8C7E0;display:flex;align-items:center;gap:12px;color:#14213D;text-align:left">
<div style="width:36px;height:36px;border-radius:18px;background:#BDF0D3;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;flex:none">2</div>
<div style="flex:1;font-weight:800;font-size:19px">Five-note scale</div>
<div style="display:flex;gap:2px" role="img" aria-label="2 of 3 stars">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#FFC93C" stroke="#14213D" stroke-width="1.6" stroke-linejoin="round"/></svg>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#FFC93C" stroke="#14213D" stroke-width="1.6" stroke-linejoin="round"/></svg>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.7.8-4.9 4.6 1.3 6.6L12 17.3 6 20.6l1.3-6.6L2.4 9.4l6.7-.8z" fill="#EEF3FB" stroke="#8A9AB8" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="2 1.8"/></svg>
</div>
</button>

<button type="button" style="height:64px;box-sizing:border-box;padding:0 12px 0 10px;border-radius:32px;background:#EEF0FF;border:4px solid #4338CA;display:flex;align-items:center;gap:12px;color:#14213D;text-align:left">
<div style="width:40px;height:40px;border-radius:20px;background:#4338CA;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;flex:none">3</div>
<div style="flex:1;font-weight:800;font-size:20px">Full octave</div>
<div style="height:40px;padding:0 20px;border-radius:20px;background:#4338CA;color:#fff;display:flex;align-items:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px">Play</div>
</button>

<button type="button" disabled aria-label="Level 4, Upper register, locked" style="height:56px;box-sizing:border-box;padding:0 16px 0 10px;border-radius:28px;background:#F3F6FB;border:3px dashed #B8C7E0;display:flex;align-items:center;gap:12px;color:#4A5A78;text-align:left">
<div style="width:36px;height:36px;border-radius:18px;background:#DCE6F7;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5A78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
</div>
<div style="flex:1;font-weight:800;font-size:19px">Upper register</div>
<div style="font-weight:800;font-size:16px">Locked</div>
</button>

<button type="button" disabled aria-label="Level 5, Leaps, locked" style="height:56px;box-sizing:border-box;padding:0 16px 0 10px;border-radius:28px;background:#F3F6FB;border:3px dashed #B8C7E0;display:flex;align-items:center;gap:12px;color:#4A5A78;text-align:left">
<div style="width:36px;height:36px;border-radius:18px;background:#DCE6F7;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A5A78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
</div>
<div style="flex:1;font-weight:800;font-size:19px">Leaps</div>
<div style="font-weight:800;font-size:16px">Locked</div>
</button>

</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1100,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>

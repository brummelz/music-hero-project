<head>
<meta charset="utf-8">
<title>Practice – Waiting for sound</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@700;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:1100px;height:720px;box-sizing:border-box;padding:28px;background:#E9F3FF;display:flex;flex-direction:column;gap:20px;font-family:'Nunito',sans-serif;color:#14213D">

<div style="height:72px;display:flex;align-items:center;justify-content:space-between">
<button type="button" aria-label="Back" style="width:64px;height:64px;border-radius:32px;background:#fff;border:3px solid #14213D;display:flex;align-items:center;justify-content:center;padding:0">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<div style="display:flex;flex-direction:column;align-items:center;line-height:1">
<div style="font-size:16px;font-weight:800;color:#4A5A78;letter-spacing:.08em;text-transform:uppercase">Target note</div>
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:48px;margin-top:4px">DO / C</div>
</div>
<div style="height:64px;box-sizing:border-box;padding:0 24px;border-radius:32px;background:#4338CA;color:#fff;display:flex;align-items:center;gap:16px">
<div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:34px">0 / 10</div>
<div style="display:flex;gap:6px" aria-hidden="true">
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
<div style="width:12px;height:12px;box-sizing:border-box;border-radius:6px;border:2px solid #A5B4FC"></div>
</div>
</div>
</div>

<div style="flex:1;min-height:0;background:#fff;border-radius:28px;overflow:hidden">
<svg viewBox="0 0 1044 288" width="1044" height="288" role="img" aria-label="Treble staff with written C4 on a ledger line. The progress ring around the note is empty and dashed, waiting for sound." style="display:block">
<text x="40" y="44" font-family="Nunito, sans-serif" font-weight="800" font-size="18" fill="#4A5A78">Written pitch · Horn in F</text>
<text x="1004" y="44" text-anchor="end" font-family="Nunito, sans-serif" font-weight="800" font-size="18" fill="#4A5A78">Hold for 3 seconds</text>
<g stroke="#14213D" stroke-width="3" stroke-linecap="round">
<line x1="60" y1="70" x2="984" y2="70"/>
<line x1="60" y1="98" x2="984" y2="98"/>
<line x1="60" y1="126" x2="984" y2="126"/>
<line x1="60" y1="154" x2="984" y2="154"/>
<line x1="60" y1="182" x2="984" y2="182"/>
</g>
<text x="84" y="190" font-family="'Noto Music', serif" font-size="150" fill="#14213D">𝄞</text>
<circle cx="522" cy="210" r="40" fill="none" stroke="#B8C7E0" stroke-width="6" stroke-dasharray="3 14" stroke-linecap="round"/>
<line x1="486" y1="210" x2="558" y2="210" stroke="#14213D" stroke-width="3" stroke-linecap="round"/>
<line x1="539" y1="207" x2="539" y2="126" stroke="#14213D" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="522" cy="210" rx="18" ry="13" fill="#14213D" transform="rotate(-20 522 210)"/>
</svg>
</div>

<div style="height:160px;box-sizing:border-box;background:#fff;border-radius:28px;padding:14px 40px 12px;display:flex;flex-direction:column;justify-content:space-between">
<div style="position:relative;height:56px;margin-top:8px">
<div style="display:flex;height:56px;border-radius:28px;overflow:hidden;opacity:0.35">
<div style="width:20%;background:#FF6B6B"></div>
<div style="width:15%;background:#FFC93C"></div>
<div style="width:30%;background:#3DD68C"></div>
<div style="width:15%;background:#FFC93C"></div>
<div style="width:20%;background:#FF6B6B"></div>
</div>
<div style="position:absolute;left:50%;top:0;width:14px;height:56px;margin-left:-7px;box-sizing:border-box;border-radius:7px;background:#fff;border:3px dashed #4A5A78"></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;font-weight:800;font-size:18px;color:#4A5A78">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
Flat
</div>
<div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;font-weight:800;font-size:18px;color:#4A5A78">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
In tune
</div>
<div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;font-weight:800;font-size:18px;color:#4A5A78">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
Sharp
</div>
</div>
</div>

<div style="height:84px;border-radius:28px;background:#DCE6F7;display:flex;align-items:center;gap:18px;padding:0 28px">
<div style="width:52px;height:52px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/></svg>
</div>
<div style="font-family:'Fredoka',sans-serif;font-weight:500;font-size:32px">Take a breath and play your Do!</div>
<div style="margin-left:auto;font-weight:800;font-size:24px;color:#4A5A78">Listening…</div>
</div>

</div>
